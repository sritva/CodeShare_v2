# Server Configuration
server.port=8080

# Database Configuration (H2 Default)
spring.datasource.url=jdbc:h2:mem:codeshare;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (disabled by default - enable in dev profile)
spring.h2.console.enabled=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring MVC JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Disable Thymeleaf view resolution to let JSP internal resource view resolver handle views
spring.thymeleaf.enabled=false

# Include local profile for secrets/API keys
spring.profiles.include=local


