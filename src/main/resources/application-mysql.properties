# Database Configuration (MySQL Profile)
spring.datasource.url=jdbc:mysql://localhost:3306/codeshare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 Console (disabled for MySQL profile)
spring.h2.console.enabled=false
