services:

  db:
    image: mysql:8.0
    container_name: codeshare-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: codeshare
      MYSQL_USER: ${MYSQL_USER:-codeshare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codeshare}
    ports:
      - "3307:3306"
    volumes:
      - codeshare_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: codeshare-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/codeshare
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-codeshare}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-codeshare}
      JWT_SECRET: ${JWT_SECRET:-codeshare-super-secret-key-that-is-long-enough-for-hs256}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  codeshare_db:
